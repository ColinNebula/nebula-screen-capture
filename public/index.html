<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    
    <!-- Security Headers -->
    <!-- Content Security Policy: Relaxed for Electron media capture and payment processing -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob: data: mediastream:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://*.stripe.com https://www.paypal.com https://www.paypalobjects.com file:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com file:; font-src 'self' https://fonts.gstatic.com data: file:; img-src 'self' data: https: blob: file: mediastream:; media-src 'self' data: blob: mediastream: file:; connect-src 'self' https://api.github.com https://api.stripe.com https://*.stripe.com https://www.paypal.com file: blob:; frame-src https://js.stripe.com https://*.stripe.com https://www.paypal.com; base-uri 'self'; form-action 'self';" />
    
    <!-- X-Content-Type-Options: Prevent MIME sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Referrer Policy: Control referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Permissions Policy: Control browser features -->
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, display-capture=*, geolocation=(), payment=(self), usb=(), interest-cohort=()" />
    
    <!-- X-XSS-Protection: Enable XSS filter (legacy browsers) -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' stroke='%23667eea' stroke-width='1.5' fill='none' stroke-dasharray='3 1.5' opacity='0.8'/><path d='M8 13 Q11 8 16 10 Q21 11 24 14 Q22 19 18 21 Q13 22 10 18 Q6 16 8 13 Z' fill='%23667eea' opacity='0.9'/><ellipse cx='15' cy='15' rx='6' ry='4' fill='%23667eea' opacity='0.5'/><circle cx='16' cy='16' r='3' fill='%23ffffff'/><rect x='5' y='5' width='3' height='3' fill='%23667eea' opacity='0.8'/><rect x='24' y='5' width='3' height='3' fill='%23667eea' opacity='0.8'/><rect x='5' y='24' width='3' height='3' fill='%23667eea' opacity='0.8'/><rect x='24' y='24' width='3' height='3' fill='%23667eea' opacity='0.8'/></svg>" />
    
    <!-- Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#667eea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    
    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nebula" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/logo512.png" />
    
    <!-- Android Chrome -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#667eea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a2e" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#667eea" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/logo192.png" />
    <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml" />
    
    <!-- Samsung Internet -->
    <meta name="samsung-internet-app-badge" content="true" />
    
    <!-- Performance & Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/logo192.png" as="image" />
    
    <!-- Disable tap highlight on mobile -->
    <style>
      * {
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        -webkit-touch-callout: none;
      }
      
      /* Prevent pull-to-refresh on mobile */
      body {
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }
      
      /* Smooth scrolling for mobile */
      html {
        scroll-behavior: smooth;
      }
      
      /* Safe area insets for notched devices */
      @supports (padding: max(0px)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
    </style>
    
    <meta
      name="description"
      content="Professional screen recording made simple. Capture your screen with high-quality video and audio, customize recording settings, and manage your recordings with Nebula Screen Capture."
    />
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Nebula Screen Capture - Professional Screen Recording</title>
    
    <!-- Meta tags for SEO -->
    <meta name="keywords" content="screen recording, screen capture, video recording, desktop recording, webcam, audio recording, pwa, progressive web app">
    <meta name="author" content="Nebula Team">
    <meta name="application-name" content="Nebula Screen Capture" />
    
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Nebula Screen Capture - Professional Screen Recording">
    <meta property="og:description" content="Capture your screen with high-quality video and audio, customize recording settings, and manage your recordings with ease.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png">
    <meta property="og:url" content="https://nebula3ddev.com">
    
    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Nebula Screen Capture">
    <meta name="twitter:description" content="Professional screen recording made simple">
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png">
    
    <!-- Performance Hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
